<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="airfryerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b7a75;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Airfryer body -->
  <rect x="25" y="35" width="50" height="45" rx="8" fill="url(#airfryerGradient)" />
  
  <!-- Airfryer window -->
  <rect x="32" y="45" width="36" height="25" rx="4" fill="#f3fbfa" opacity="0.9" />
  
  <!-- Heat waves inside -->
  <path d="M 40 55 Q 45 52 50 55 T 60 55" stroke="#ff6b6b" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M 40 60 Q 45 57 50 60 T 60 60" stroke="#ff6b6b" stroke-width="2" fill="none" opacity="0.5" />
  
  <!-- Control panel -->
  <circle cx="42" cy="27" r="3" fill="#eef8f7" />
  <circle cx="58" cy="27" r="3" fill="#eef8f7" />
  
  <!-- Temperature arrow -->
  <path d="M 35 20 L 35 12 L 32 15 M 35 12 L 38 15" stroke="#1b1f24" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Time arrow -->
  <path d="M 65 20 L 65 12 L 62 15 M 65 12 L 68 15" stroke="#1b1f24" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Base -->
  <rect x="30" y="80" width="40" height="4" rx="2" fill="#0b7a75" />
</svg>
